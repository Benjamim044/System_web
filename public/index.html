<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>QR Generator</title>

    <link rel="stylesheet" href="style.css" />

    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  </head>

  <body>
    <header>Gerador de QR Code</header>

    <div class="container">
      <div class="card">
        <h2>Gerar QR</h2>

        <input id="linkInput" type="text" placeholder="Digite link ou texto" />

        <button onclick="generateQR()">Gerar QR</button>
        <button onclick="downloadQR()">Baixar QR</button>

        <div id="result"></div>

        <div id="qrcode" class="qr-box">QR aparecerá aqui</div>
      </div>

      <div class="card">
        <h2>Histórico</h2>
        <ul id="list"></ul>
      </div>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
