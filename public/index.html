<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR Code Generator</title>

    <!-- Fonte moderna -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --primary-blue: #003a8f;
        --primary-orange: #f37021;
        --bg: #f4f6f9;
        --text: #1f2937;
        --muted: #6b7280;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Inter", sans-serif;
        background-color: var(--bg);
        color: var(--text);
      }

      header {
        background: linear-gradient(
          90deg,
          var(--primary-blue),
          var(--primary-orange)
        );
        color: white;
        padding: 26px;
        text-align: center;
        font-size: 1.4rem;
        font-weight: 600;
        letter-spacing: 0.5px;
      }

      .container {
        max-width: 880px;
        margin: 50px auto;
        padding: 0 20px;
      }

      .card {
        background: white;
        padding: 28px;
        border-radius: 14px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        margin-bottom: 24px;
      }

      .title {
        font-size: 1.2rem;
        font-weight: 600;
        margin-bottom: 18px;
        color: var(--primary-blue);
      }

      .input-group {
        display: flex;
        gap: 12px;
        margin-bottom: 24px;
      }

      input {
        flex: 1;
        padding: 14px;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        font-size: 0.95rem;
        transition: 0.2s;
      }

      input:focus {
        outline: none;
        border-color: var(--primary-blue);
      }

      button {
        background-color: var(--primary-orange);
        color: white;
        border: none;
        padding: 14px 22px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 500;
        transition: 0.2s;
      }

      button:hover {
        background-color: #d95d13;
      }

      /* Área do QR */
      .qr-container {
        border: 2px dashed var(--primary-blue);
        border-radius: 12px;
        height: 240px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: var(--muted);
        text-align: center;
        padding: 20px;
        transition: 0.2s;
        position: relative;
      }

      .qr-container strong {
        color: var(--primary-blue);
      }

      .qr-container span {
        font-size: 0.9rem;
        margin-top: 8px;
      }

      .qr-container:hover {
        background-color: #eef4ff;
        border-color: var(--primary-orange);
      }

      /* Tag decorativa */
      .qr-tag {
        position: absolute;
        top: -10px;
        right: 15px;
        background-color: var(--primary-orange);
        color: white;
        font-size: 0.7rem;
        padding: 4px 8px;
        border-radius: 6px;
      }

      /* Lista */
      .list {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      .list li {
        padding: 14px;
        border-radius: 8px;
        transition: 0.2s;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .list li:hover {
        background-color: #f9fafb;
      }

      .link {
        color: var(--primary-blue);
        text-decoration: none;
        font-size: 0.9rem;
        word-break: break-all;
      }

      .badge {
        background-color: var(--primary-orange);
        color: white;
        font-size: 0.7rem;
        padding: 4px 8px;
        border-radius: 6px;
      }

      .empty {
        font-size: 0.85rem;
        color: var(--muted);
      }
    </style>
  </head>

  <body>
    <header>Gerador de QR Code</header>

    <div class="container">
      <!-- Gerador -->
      <div class="card">
        <div class="title">Gerar novo QR Code</div>

        <div class="input-group">
          <input type="text" placeholder="https://seulink.com" />
          <button>Gerar</button>
        </div>

        <!-- PLACEHOLDER DO QR -->
        <div class="qr-container">
          <div class="qr-tag">QR</div>
          <strong>Área do QR Code</strong>
          <span>O código será renderizado aqui</span>
        </div>
      </div>

      <!-- Lista -->
      <div class="card">
        <div class="title">Links gerados</div>

        <ul class="list">
          <li>
            <a class="link" href="#">https://exemplo1.com</a>
            <span class="badge">ativo</span>
          </li>
          <li>
            <a class="link" href="#">https://exemplo2.com</a>
            <span class="badge">ativo</span>
          </li>
          <li>
            <a class="link" href="#">https://exemplo3.com</a>
            <span class="badge">ativo</span>
          </li>
        </ul>

        <!-- Caso vazio -->
        <!-- <div class="empty">Nenhum link gerado ainda.</div> -->
      </div>
    </div>
  </body>
</html>
